<h1>goedam</h1>
<p>goedam은 개발자 본인의 유튜브 채널에 영상을 올리기 위해 만든 개인용 도구입니다.</p>

  <li>쓰는 사람: 개발자 본인뿐입니다. 다른 사람에게 제공하지 않습니다.</li>
